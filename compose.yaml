name: corent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in .env}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?set it in .env}
      HOUSE_DB_PASSWORD: ${HOUSE_DB_PASSWORD:?set it in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set it in .env}
      ADMIN_DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set it in .env}
      NOTIF_DB_PASSWORD: ${NOTIF_DB_PASSWORD:?set it in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/01-databases.sql:ro
      - ./docker/postgres/02-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: user_service
    environment:
      DB_NAME: users_service_db
      DB_USER: user_service_role
      DB_PASSWORD: ${USER_DB_PASSWORD:?set it in .env}
      DB_HOST: postgres
      DB_PORT: "5432"
      GRPC_PORT: "50053"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY_USER:?set it in .env}
      DJANGO_DEBUG: "False"
      JWT_SECRET: ${JWT_SECRET:?set it in .env}
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:?set it in .env}
      FRONTEND_RESET_URL: http://localhost:5173/reset-password
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50053), 2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  house-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: house_service
    environment:
      DB_NAME: house_service_db
      DB_USER: house_service_role
      DB_PASSWORD: ${HOUSE_DB_PASSWORD:?set it in .env}
      DB_HOST: postgres
      DB_PORT: "5432"
      SECRET_KEY: ${DJANGO_SECRET_KEY_HOUSE:?set it in .env}
      DEBUG: "False"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50052), 2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  application-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: application_service
    environment:
      DB_NAME: app_service_db
      DB_USER: application_service_role
      DB_PASSWORD: ${APP_DB_PASSWORD:?set it in .env}
      DB_HOST: postgres
      DB_PORT: "5432"
      SECRET_KEY: ${DJANGO_SECRET_KEY_APPLICATION:?set it in .env}
      DEBUG: "False"
      USER_GRPC_ADDR: user-service:50053
      HOUSE_GRPC_ADDR: house-service:50052
      NOTIF_GRPC_ADDR: notification-service:50056
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:?set it in .env}
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      house-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), 2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  admin-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: admin_service
    environment:
      DB_NAME: admin_service_db
      DB_USER: admin_service_role
      DB_PASSWORD: ${ADMIN_DB_PASSWORD:?set it in .env}
      DB_HOST: postgres
      DB_PORT: "5432"
      SECRET_KEY: ${DJANGO_SECRET_KEY_ADMIN:?set it in .env}
      DEBUG: "False"
      ADMIN_GRPC_ADDR: 0.0.0.0:50054
      USER_GRPC_ADDR: user-service:50053
      HOUSE_GRPC_ADDR: house-service:50052
      APP_GRPC_ADDR: application-service:50051
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:?set it in .env}
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      house-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50054), 2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
  notification-service:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        SERVICE: notification_service
    environment:
      DATABASE_URL: postgresql+psycopg2://notification_service_role:${NOTIF_DB_PASSWORD:?set it in .env}@postgres:5432/notification_service_db
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50056"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50056), 2)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    environment:
      USER_GRPC_ADDR: user-service:50053
      HOUSE_GRPC_ADDR: house-service:50052
      APP_GRPC_ADDR: application-service:50051
      ADMIN_GRPC_ADDR: admin-service:50054
      NOTIF_GRPC_ADDR: notification-service:50056
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:?set it in .env}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      user-service:
        condition: service_healthy
      house-service:
        condition: service_healthy
      application-service:
        condition: service_healthy
      admin-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      VITE_USE_MOCK: "false"
      VITE_AUTH_BYPASS: "false"
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
volumes:
  pgdata:

